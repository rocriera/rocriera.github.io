<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROC RIERA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="reviews.css">
</head>
<body>
  <header class="site-header">
    <h1>ROC RIERA</h1>
  </header>

  <main>
    <!-- Vacation banner: content and visibility are set in config.js -->
    <section id="vacances-banner" class="franja-vacances">
      <p id="vacances-t"></p>
    </section>

    <!-- Prices + background carousel -->
    <section id="prices" class="container stack gap-l">
      <div class="carousel-bg">
        <div class="carousel-track" id="carouselTrack"></div>
      </div>
      <div class="carousel-overlay"></div>

      <div class="container price-section-content">
        <div class="price-list">
          <div class="price-item">
            <div class="price">8€</div>
            <div class="price-info">
              <span class="text-white">en reserves</span>
              <span class="text-white">els <strong class="highlight">divendres</strong></span>
            </div>
          </div>

          <div class="price-item">
            <div class="price">10€</div>
            <div class="price-info">
              <strong class="highlight">altres dies</strong>
            </div>
          </div>
        </div>

        <div class="arrow-label">↓ reserves més avall ↓</div>
      </div>
    </section>

    <!-- Contact strip -->
    <section class="franja-info">
      <p>Per reservar fora d'horari, o si hi ha algun problema, contacta per <strong>WhatsApp</strong></p>
      <p><a href="https://wa.me/34608993681" target="_blank" rel="noopener">+34 608 99 36 81</a></p>
    </section>

    <!-- Booking (Calendly) -->
    <section id="booking" class="stack gap-m">
      <div class="calendar-card" id="calendarCard">
        <div class="calendly-inline-widget" data-url="https://calendly.com/rocrieramalgosa/tall"></div>
      </div>
    </section>

    <!-- Ressenyes (Firebase): lògica a reviews.js -->
    <section id="reviews">
      <h2>Ressenyes</h2>
      <div class="review-summary" id="reviewSummary"></div>

      <form class="review-form" id="reviewForm" novalidate>
        <label for="reviewName">
          El teu nom
          <input type="text" id="reviewName" name="name" autocomplete="given-name" placeholder="Nom" required>
        </label>

        <!-- Camp trampa per bots: no omplir -->
        <div class="hp-field" aria-hidden="true">
          <label>Web <input type="text" id="reviewWeb" name="web" tabindex="-1" autocomplete="off"></label>
        </div>

        <div>
          <label id="starLabel">Puntuació</label>
          <div class="star-input" id="starInput" role="radiogroup" aria-labelledby="starLabel"></div>
        </div>

        <button type="submit" class="review-submit" id="reviewSubmit">Enviar ressenya</button>
        <p class="review-status" id="reviewStatus" role="status" aria-live="polite"></p>
      </form>

      <div class="review-list" id="reviewList"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© <span id="year"></span> Roc Riera Malgosa</small>
    </div>
  </footer>

  <script src="https://assets.calendly.com/assets/external/widget.js" async></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
  <script src="reviews.js"></script>
</body>
</html>

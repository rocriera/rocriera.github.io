<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROC RIERA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>ROC RIERA</h1>
  </header>

<main>

  <section id="vacances-banner" class="franja-vacances">
    <p id="vacances-t"></p>
  </section>

  <section id="prices" class="container stack gap-l reveal">
    <div class="carousel-bg">
      <div class="carousel-track" id="carouselTrack"></div>
    </div>
    
    <div class="carousel-overlay"></div>

    <div class="container price-section-content">
      <div class="price-list">
        
        <div class="price-item">
          <div class="price">7€</div>
          <div class="price-info">
            <span class="text-white">en reserves</span>
            <span class="text-white">els <strong class="text-blue"> divendres</strong></span>
          </div>
        </div>
        
        <div class="price-item">
          <div class="price">9€</div>
          <div class="price-info">
            <strong class="text-blue"> dijous</strong>
            <strong class="text-blue">i altres dies</strong>
          </div>
        </div>

      </div>
      
      <div class="arrow-label animated-arrow">↓ reserves més avall ↓</div>
    </div>
  </section>

  <section class="franja-info">
    <p>Per reservar fora d'horari, o si hi ha algun problema, contacta per <strong>WhatsApp</strong></p>
    <p> <a href="https://wa.me/34608993681" target="_blank">+34 608 99 36 81</a></p>
  </section>

  <section id="booking" class="stack gap-m reveal">
    <div class="calendar-card" id="calendarCard">
      <div class="calendly-inline-widget" data-url="https://calendly.com/rocrieramalgosa/tall"></div>
      <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
    </div>
  </section>
</main>

  <footer class="site-footer">
    <div class="container">
      <small>© <span id="year"></span> Roc Riera Malgosa</small>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
